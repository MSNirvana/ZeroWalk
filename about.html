<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>关于我们 · 第零漫步 ZeroWalk</title>
    <link rel="stylesheet" href="styles/site.css" />
  </head>
  <body>
    <div class="site-shell">
      <div data-shared-header></div>
      <main>
        <section class="page-head">
          <span class="section-label">About</span>
          <h1>为什么叫第零漫步</h1>
          <p>第零不是噱头，漫步也不是慢。它们是我们做项目的真实方式。</p>
        </section>
        <section class="page-wrap detail-grid">
          <article class="detail-block">
            <span class="story-tag">第零</span>
            <h3>真正失败的项目，常常死在出发之前</h3>
            <p>很多 AI 项目一开始就把顺序做反了。先选工具，再找场景；先写需求，再想 ROI；最后做出一堆没人用的东西。第零漫步把“值不值得做、从哪里切入、团队愿不愿意配合”放在最前面，这就是第零步。</p>
          </article>
          <article class="detail-block">
            <span class="story-tag">漫步</span>
            <h3>不是冲刺交付，是走进去做</h3>
            <p>漫步不是慢，而是深入。我们更愿意走进业务现场，理解重复工作、卡点、信息断层和内部配合，而不是站在外面用一套模板解释问题。</p>
          </article>
        </section>

        <section class="quote-band">
          <blockquote>我们不站在外面给建议。我们走进去，亲手把事情做成。</blockquote>
        </section>
      </main>
      <div data-shared-footer></div>
    </div>
    <script src="scripts/shared.js"></script>
  </body>
</html>
