<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZeroWalk</title>
    <link rel="icon" href="assets/favicon.png" type="image/png" />
    <meta
      name="description"
      content="ZeroWalk — Walk in. Make AI work."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="styles/home.css" />
  </head>
  <body class="page-home">
    <div class="bg-gradient" aria-hidden="true"></div>
    <canvas id="canvas" aria-hidden="true"></canvas>

    <nav id="topNavTags" class="top-nav top-nav--home" aria-label="站点导航"></nav>

    <p id="hint" class="hint">点击任意处</p>

    <div id="contactPanel" class="home-contact-panel" aria-hidden="true">
      <div class="home-contact-middle">
        <div class="home-prose">
          <span class="home-prose__kicker">AI 时代，新的「阶级」出现了。</span>
          <p class="home-prose__lead">
            Anthropic CEO Dario Amodei 提出了一个极其震撼的概念：<br />
            「Zero World Country」— 第零世界国家。
          </p>
          <p class="home-prose__body">
            他说：这个世界已经有 1000 万人，提前进入了 AI 新世界。<br />
            他们没有国界，没有总统，没有边界。
          </p>
          <p class="home-prose__body">
            但他们有：AI 算力、工作流、自动化、Agent 以及被 AI 放大的能力。
          </p>
          <p class="home-prose__muted">而剩下的人，还停留在旧世界。</p>
        </div>
      </div>
      <div class="home-contact-footer">
        <button type="button" id="contactBtn" class="contact-btn">联系我们</button>
        <p class="home-contact-tagline">「跟我们一起去第零世界走走」 — 第零漫步。</p>
      </div>
    </div>

    <div id="modalOverlay" class="modal-overlay" aria-hidden="true"></div>
    <div
      id="modalCard"
      class="modal-card"
      role="dialog"
      aria-labelledby="modalTitle"
      aria-modal="true"
    >
      <button type="button" class="modal-close" id="modalClose" aria-label="关闭">×</button>

      <p class="modal-section-title" id="modalTitle">扫码联系</p>
      <div class="modal-qr">
        <img src="assets/qrcode.png" alt="企业微信二维码" width="160" height="160" />
        <p>扫描添加企业微信</p>
      </div>

      <p class="modal-divider">或留下联系方式</p>

      <form id="contactForm" novalidate>
        <div class="form-field">
          <label for="fieldName">姓名</label>
          <input id="fieldName" name="name" type="text" placeholder="您的姓名" required />
        </div>
        <div class="form-field">
          <label for="fieldPhone">电话</label>
          <input id="fieldPhone" name="phone" type="tel" placeholder="手机号码" required />
        </div>
        <div class="form-field">
          <label for="fieldNeed">需求</label>
          <input
            id="fieldNeed"
            name="need"
            type="text"
            placeholder="简单描述您的需求（选填）"
          />
        </div>
        <button type="submit" class="form-submit" id="formSubmit">提交</button>
      </form>
    </div>

    <script src="scripts/site-config.js"></script>
    <script src="scripts/storage.js"></script>
    <script src="scripts/shared.js"></script>
    <script src="scripts/home-ui.js"></script>
    <script src="scripts/home-canvas.js" defer></script>
  </body>
</html>
