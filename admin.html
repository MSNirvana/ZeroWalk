<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>线索管理演示页 · 第零漫步 ZeroWalk</title>
    <link rel="icon" href="assets/favicon.png" type="image/png" />
    <link rel="stylesheet" href="styles/site.css" />
  </head>
  <body class="page-sub">
    <div class="bg-gradient" aria-hidden="true"></div>
    <header id="topNavTags" class="top-nav-bar" aria-label="站点导航"></header>

    <div class="site-shell site-shell--sub">
      <main class="site-main">
        <section class="page-head">
          <div class="section-label">Admin Preview</div>
          <h1>这是首版最小管理端，不是最终 CRM</h1>
          <p>它的任务只有一个：验证线索是否被结构化沉淀下来。</p>
        </section>

        <section class="page-wrap">
          <div class="stats-grid" style="margin-bottom: 1rem;">
            <article class="metric-card"><div class="delta">总提交量</div><div id="stat-total" class="stat-number">0</div><strong>全部线索</strong></article>
            <article class="metric-card"><div class="delta">潜在客户</div><div id="stat-client" class="stat-number">0</div><strong>业务诊断入口</strong></article>
            <article class="metric-card"><div class="delta">合作伙伴申请</div><div id="stat-partner" class="stat-number">0</div><strong>核心顾问 / 城市合伙人</strong></article>
          </div>

          <div class="admin-grid">
            <aside class="admin-panel">
              <div class="section-label">记录列表</div>
              <h3>本地演示数据</h3>
              <p>当前页面读取浏览器本地 `localStorage`。正式版可替换成数据库与后台权限系统。</p>
              <ul id="record-list" class="record-list"></ul>
            </aside>
            <section class="admin-panel">
              <div class="section-label">详情</div>
              <h3>结构化档案预览</h3>
              <p>这里展示顾问在首次跟进前最需要看到的信息。</p>
              <div id="record-detail"></div>
            </section>
          </div>
        </section>
      </main>
      <div data-shared-footer></div>
    </div>
    <script src="scripts/site-config.js"></script>
    <script src="scripts/storage.js"></script>
    <script src="scripts/shared.js"></script>
    <script src="scripts/admin.js"></script>
  </body>
</html>
